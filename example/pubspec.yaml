name: pikafish_engine_example
description: Demonstrates how to use the pikafish_engine plugin.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  path_provider:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: "packages/path_provider/path_provider"

  pikafish_engine:
    path: ../

  cupertino_icons: ^1.0.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

dependency_overrides:
  path_provider:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: "packages/path_provider/path_provider"

flutter:
  uses-material-design: true

  assets:
    - assets/pikafish.nnue
